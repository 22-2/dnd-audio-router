[package]
name = "dnd-audio-router"
version = "0.1.0"
description = "アプリごとの音声の出力先を振り分けるWindows向けツール"
edition = "2021"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
