[package]
name = "dnd-audio-router"
version = "0.1.0"
description = "アプリごとの音声の出力先を振り分けるWindows向けツール"
edition = "2021"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

# 参照先（AppAudioRouter）と同じ 0.58 系。新しい版へは、音声の処理が揃ってから上げる。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
